spring.application.name=MeteoAPI
server.port=8080
server.servlet.session.tracking-modes=cookie
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.force=true

# Propiedades propias, leidas por constructor en EstacionService.
meteoapi.nombre=MeteoAPI
meteoapi.descripcion=La meteorolog\u00EDa en tu mano.
meteoapi.minimo-rayos=1

# Los mensajes de errores controlados tambien se muestran al consultar la API.
spring.web.error.include-message=always
# La API mantiene errores breves tanto con DevTools como al ejecutar el JAR.
spring.web.error.include-stacktrace=never

